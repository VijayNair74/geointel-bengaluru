name: Validate GeoIntel
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --prefix web --no-audit --no-fund
      - name: Build React app
        run: npm run build --prefix web
      - name: Verify compiled assets
        run: |
          test -f web/dist/index.html
          grep -q '/assets/index-' web/dist/index.html
          ! grep -q 'src/main.jsx' web/dist/index.html
          find web/dist/assets -name '*.js' -type f | grep -q .
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
