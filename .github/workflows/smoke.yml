name: GeoIntel production smoke test
on:
  workflow_run:
    workflows: ["Validate and prepare GeoIntel assets"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Verify compiled HTML and visible React dashboard at public URL
        env:
          SITE_URL: https://geointel-bengaluru.vijaynath-nair.workers.dev/
        run: |
          set -eu
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          echo "Using browser: $CHROME"
          "$CHROME" --version
          for attempt in $(seq 1 12); do
            echo "Production browser attempt $attempt"
            curl -L -sS --max-time 20 -o /tmp/geointel-index.html -w 'HTTP %{http_code}\n' "$SITE_URL" || true
            if ! grep -q '/assets/index-' /tmp/geointel-index.html; then
              echo "Cloudflare is not serving compiled Vite assets in HTML yet."
            fi
            timeout 30 "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --virtual-time-budget=5000 --dump-dom "$SITE_URL" > /tmp/geointel-dom.html 2>/tmp/chrome-errors.txt || true
            if grep -q 'Explore Bengaluru' /tmp/geointel-dom.html && grep -q 'Connectivity' /tmp/geointel-dom.html && grep -q '/assets/index-' /tmp/geointel-index.html; then
              echo "PASS: Production HTML contains compiled assets and Chromium rendered React dashboard."
              exit 0
            fi
            echo "Still not ready; first 200 bytes of rendered DOM:"
            head -c 200 /tmp/geointel-dom.html || true
            echo
            sleep 10
          done
          echo "FAIL: Production did not render GeoIntel with compiled JS assets."
          cat /tmp/chrome-errors.txt || true
          exit 1
