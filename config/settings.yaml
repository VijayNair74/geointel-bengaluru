project:
  name: GeoIntel
  city: Bengaluru
  country: India
  default_crs: EPSG:4326
  metric_crs: EPSG:32643
  version: 0.3.0
# Approximate demo bounding box only; NOT an official Bengaluru metropolitan boundary.
aoi:
  west: 77.35
  south: 12.75
  east: 77.85
  north: 13.35   # extended so Devanahalli (13.247) has its full 5 km radius inside coverage
acquisition:
  overpass_url: https://overpass-api.de/api/interpreter
  # Tried in order if the primary refuses (overpass-api.de returns 403 to some cloud runners).
  overpass_fallback_urls:
    - https://overpass.private.coffee/api/interpreter
    - https://maps.mail.ru/osm/tools/overpass/api/interpreter
  request_timeout_seconds: 240
  pause_between_requests_seconds: 5
  # Features are fetched only around each demo location (radius = largest metric
  # radius for that layer + margin), not for the whole AOI. A whole-city building
  # query is far too large for the shared Overpass service and for static hosting.
  fetch_strategy: per_demo_location
  user_agent: GeoIntelBengaluruMVP/0.3 (+https://github.com/VijayNair74/geointel-bengaluru)
outputs:
  raw_dir: data/raw
  processed_dir: data/processed
  manifest: data/processed/source_manifest.json
demo_locations:
  - [Whitefield, 12.9698, 77.7500]
  - [Hebbal, 13.0358, 77.5970]
  - [Sarjapur, 12.9081, 77.6950]
  - [Electronic City, 12.8399, 77.6770]
  - [Devanahalli, 13.2470, 77.7130]
osm_layers:
  schools:
    tags: {amenity: [school, college, university, kindergarten]}
    fetch_radius_m: 3500
    fetch_scope: aoi   # city-wide so the browser can compute any point
  healthcare:
    tags: {amenity: [hospital, clinic, doctors, health_centre]}
    fetch_radius_m: 5500
    fetch_scope: aoi   # city-wide so the browser can compute any point
  parks:
    tags: {leisure: [park, garden, playground]}
    fetch_radius_m: 3500
    fetch_scope: aoi   # city-wide so the browser can compute any point
  water:
    tags: {natural: [water], water: [lake, pond, reservoir], landuse: [reservoir]}
    fetch_radius_m: 8000
    fetch_scope: aoi   # city-wide so the browser can compute any point
  retail:
    tags: {shop: [supermarket, mall, department_store, convenience]}
    fetch_radius_m: 2500
    fetch_scope: aoi   # city-wide so the browser can compute any point
  roads:
    tags: {highway: [motorway, trunk, primary, secondary, tertiary, residential, unclassified, service]}
    fetch_radius_m: 1500
  buildings:
    tags: {building: true}
    fetch_radius_m: 1200
  # Connectivity layers: fetched for the whole AOI (fetch_scope: aoi) because the
  # nearest airport/metro/highway can be far outside the per-location radius.
  # Only operational features: OSM tags construction/proposed lines differently.
  metro_stations:
    tags: {station: [subway]}
    # Proposed / under-construction stations also carry station=subway in OSM;
    # keep only operational ones (railway=station) and drop names flagged as such.
    require: {railway: [station]}
    exclude_name_pattern: '(?i)\b(?:proposed|u/c|under construction)\b'
    fetch_scope: aoi
  rail_stations:
    tags: {railway: [station, halt]}
    exclude: {station: [subway, light_rail, monorail]}
    exclude_name_pattern: '(?i)\b(?:proposed|u/c|under construction)\b'
    fetch_scope: aoi
  airports:
    tags: {aeroway: [aerodrome]}
    fetch_scope: aoi
  highways:
    tags: {highway: [motorway, trunk]}
    fetch_scope: aoi
  # Named residential complexes by known developers (see `developers` below);
  # each becomes a project with its own location report.
  developer_projects:
    tags: {landuse: [residential], building: [apartments, residential]}
    developer_match: true
    fetch_scope: aoi
  # Proposed / under-construction metro stations, shown separately and never
  # mixed into operational distances.
  metro_upcoming:
    tags: {station: [subway]}
    upcoming_only: true
    fetch_scope: aoi
  # Stormwater drains (rajakaluve), canals and streams. OSM coverage is partial.
  drains:
    tags: {waterway: [drain, canal, stream, river]}
    fetch_scope: aoi

# Developer brands used to auto-discover projects in OpenStreetMap. A complex is
# matched when its OSM name starts with one of the prefixes (whole word).
developers:
  - {builder: Navami, prefixes: [Navami]}
  - {builder: Prestige Group, prefixes: [Prestige]}
  - {builder: Sobha, prefixes: [Sobha]}
  - {builder: Brigade Group, prefixes: [Brigade]}
  - {builder: Puravankara, prefixes: [Purva, Provident]}
  - {builder: Godrej Properties, prefixes: [Godrej]}
  - {builder: Salarpuria Sattva, prefixes: [Salarpuria, Sattva]}
  - {builder: Shriram Properties, prefixes: [Shriram]}
  - {builder: Mantri Developers, prefixes: [Mantri]}
  - {builder: Total Environment, prefixes: [Total Environment]}
  - {builder: Embassy Group, prefixes: [Embassy]}
  - {builder: Assetz, prefixes: [Assetz]}
  - {builder: Mahindra Lifespaces, prefixes: [Mahindra]}
  - {builder: Adarsh Developers, prefixes: [Adarsh]}
  - {builder: Sumadhura, prefixes: [Sumadhura]}
  - {builder: SNN Raj Corp, prefixes: [SNN]}
  - {builder: Vaswani Group, prefixes: [Vaswani]}
  - {builder: DLF, prefixes: [DLF]}
  - {builder: Tata Housing, prefixes: [Tata]}
  - {builder: Ozone Group, prefixes: [Ozone]}
  - {builder: Mana Projects, prefixes: [Mana]}
  - {builder: Nitesh Estates, prefixes: [Nitesh]}
  - {builder: Century Real Estate, prefixes: [Century]}
