sources:
  - id: osm_geofabrik_or_overpass
    name: OpenStreetMap features (initial prototype via OSMnx/Overpass)
    url: https://www.openstreetmap.org/
    download_url: https://download.geofabrik.de/asia/india.html
    owner: OpenStreetMap contributors
    format: Overpass JSON / OSM PBF
    license: ODbL 1.0
    attribution: © OpenStreetMap contributors
    access: Public; Overpass is shared and rate-limited. Geofabrik offers free regional extracts.
    intended_layers: [schools, healthcare, parks, water, retail, roads, buildings]
